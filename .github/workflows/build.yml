name: Build IPA

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: 安装 XcodeGen
        run: brew install xcodegen

      - name: 选择新版 Xcode
        run: |
          XC="$(ls -d /Applications/Xcode_*.app | grep -v -i beta | tail -1)"
          echo "使用: $XC"
          sudo xcode-select -s "$XC"
          xcodebuild -version

      - name: 生成 Xcode 工程
        run: xcodegen generate

      - name: 编译 (未签名)
        run: |
          xcodebuild -project QHMCourse.xcodeproj \
            -scheme QHMCourse \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: 打包 IPA
        run: |
          APP="$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -1)"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -r QHMCourse.ipa Payload

      - name: 上传 IPA
        uses: actions/upload-artifact@v4
        with:
          name: QHMCourse.ipa
          path: QHMCourse.ipa
          retention-days: 30
